<!doctype html>
<!-- GrooveForge 렌더러의 최소 HTML 셸이다. -->
<!-- 실제 화면과 상태 관리는 /src/main.tsx가 root에 마운트하며, 이 파일은 문서 메타데이터와 진입 모듈만 제공한다. -->
<!-- doctype은 표준 모드 렌더링을 위해 반드시 문서의 첫 선언으로 유지한다. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GrooveForge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
